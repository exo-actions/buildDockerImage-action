name: Self-test composite actions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*/action.yml'
      - 'action.yml'
      - '.github/workflows/self-test.yml'

permissions:
  contents: read

# Cancel superseded runs on the same ref
concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Lowercase self-test image name
        id: name
        run: echo "image=${GITHUB_REPOSITORY,,}-selftest" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prep
    # Fork and Dependabot PRs get a read-only token that cannot push to ghcr.io
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.build.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Write a trivial Dockerfile
        run: |
          mkdir -p /tmp/selftest
          cat > /tmp/selftest/Dockerfile <<'EOF'
          FROM alpine:3.20
          CMD ["true"]
          EOF
      - name: Build and push self-test image
        id: build
        uses: ./build-and-push-image
        with:
          dockerImage: ${{ needs.prep.outputs.image }}
          dockerImageTag: ci-${{ github.run_id }}
          dockerFileContext: /tmp/selftest
          dockerRegistry: ghcr.io
          qemu: "false"
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  attest-and-cosign:
    runs-on: ubuntu-latest
    # Fork and Dependabot PRs get a read-only token that cannot push to ghcr.io
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: [prep, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Attest the self-test image
        uses: ./attest-image
        with:
          dockerImage: ${{ needs.prep.outputs.image }}
          dockerImageDigest: ${{ needs.build.outputs.digest }}
          dockerRegistry: ghcr.io
          attestImageRegistry: ghcr.io
          attestImage: "true"
          attestSBOM: "true"
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Cosign (keyless) the self-test image
        uses: ./cosign-image
        with:
          dockerImage: ${{ needs.prep.outputs.image }}
          dockerImageTag: ${{ needs.build.outputs.tags }}
          dockerImageDigest: ${{ needs.build.outputs.digest }}
          dockerRegistry: ghcr.io
          cosignOidcImage: "true"
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  mirror:
    runs-on: ubuntu-latest
    # Fork and Dependabot PRs get a read-only token that cannot push to ghcr.io
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: write
    needs: [prep, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Mirror the self-test image within ghcr.io
        uses: ./mirror-image
        with:
          sourceImage: ${{ needs.prep.outputs.image }}
          sourceTag: ci-${{ github.run_id }}
          sourceRegistry: ghcr.io
          targetImage: ${{ needs.prep.outputs.image }}-mirrored
          targetRegistry: ghcr.io
          SOURCE_USERNAME: ${{ github.actor }}
          SOURCE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USERNAME: ${{ github.actor }}
          TARGET_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  merge-manifest:
    runs-on: ubuntu-latest
    # Fork and Dependabot PRs get a read-only token that cannot push to ghcr.io
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: write
    needs: [prep, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fake a two-platform digest set from the single built image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          echo "$DIGEST" > /tmp/digests/amd64.digest
          echo "$DIGEST" > /tmp/digests/arm64.digest
      - name: Merge manifest
        id: merge
        uses: ./merge-manifest
        with:
          dockerImage: ${{ needs.prep.outputs.image }}
          dockerImageTag: ci-merged-${{ github.run_id }}
          dockerRegistry: ghcr.io
          digestsDir: /tmp/digests
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Check digest output was produced
        env:
          MERGED_DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          if [ -z "$MERGED_DIGEST" ]; then
            echo "❌ merge-manifest produced no digest output"
            exit 1
          fi
          echo "✅ merged digest: $MERGED_DIGEST"

  notation-local-key:
    runs-on: ubuntu-latest
    needs: [prep, build]
    # Fork and Dependabot PRs get a read-only token that cannot push to ghcr.io
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate a throwaway signing key and certificate
        id: keys
        run: |
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 -sha256 \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=selftest/O=exo-actions" \
            -addext "basicConstraints=critical,CA:FALSE" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=codeSigning"
          # Mask every line of the key, then expose both via step outputs
          while IFS= read -r line; do echo "::add-mask::$line"; done < "$RUNNER_TEMP/key.pem"
          {
            echo "key<<KEYEOF"; cat "$RUNNER_TEMP/key.pem"; echo "KEYEOF"
            echo "cert<<CERTEOF"; cat "$RUNNER_TEMP/cert.pem"; echo "CERTEOF"
          } >> "$GITHUB_OUTPUT"
          # Trust store: the self-signed cert is its own CA
          mkdir -p "$RUNNER_TEMP/truststore/x509/ca/selftest"
          cp "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/truststore/x509/ca/selftest/cert.pem"
          rm -f "$RUNNER_TEMP/key.pem"
      - name: Write trust policy
        run: |
          cat > "$RUNNER_TEMP/trustpolicy.json" <<'EOF'
          {
            "version": "1.0",
            "trustPolicies": [{
              "name": "selftest",
              "registryScopes": ["*"],
              "signatureVerification": {"level": "strict"},
              "trustStores": ["ca:selftest"],
              "trustedIdentities": ["*"]
            }]
          }
          EOF
      - name: Sign (local key) and verify with notation-image
        uses: ./notation-image
        with:
          dockerImage: ${{ needs.prep.outputs.image }}
          dockerImageDigest: ${{ needs.build.outputs.digest }}
          dockerRegistry: ghcr.io
          notationImage: "true"
          signingKey: ${{ steps.keys.outputs.key }}
          signingCert: ${{ steps.keys.outputs.cert }}
          verifyImage: "true"
          trustPolicy: ${{ runner.temp }}/trustpolicy.json
          trustStore: ${{ runner.temp }}/truststore
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
