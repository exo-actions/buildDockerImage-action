name: Merge multi-arch manifest
description: 'Merge single-platform images (pushed to the same tag) into a multi-arch manifest list by digest'
inputs:
  dockerImage:
    description: Docker Image name
    required: true
  dockerImageTag:
    description: Final tag for the merged multi-arch image
    required: true
  dockerRegistry:
    description: Docker registry
    default: "docker.io"
    required: false
  digestsDir:
    description: "Directory containing *.digest files (one per platform, each containing a single digest)"
    required: true
  DOCKER_USERNAME:
    description: Docker Registry username
    required: true
  DOCKER_PASSWORD:
    description: Docker Registry user password
    required: true
outputs:
  digest:
    description: 'Digest of the merged multi-arch manifest (first tag)'
    value: ${{ steps.merge.outputs.digest }}
runs:
  using: "composite"
  steps:
    - name: Log in to Docker Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.dockerRegistry }}
        username: ${{ inputs.DOCKER_USERNAME }}
        password: ${{ inputs.DOCKER_PASSWORD }}

    - name: Create multi-arch manifest from digests
      id: merge
      shell: bash
      env:
        REGISTRY: ${{ inputs.dockerRegistry }}
        IMAGE: ${{ inputs.dockerImage }}
        TAGS: ${{ inputs.dockerImageTag }}
        DIGESTS_DIR: ${{ inputs.digestsDir }}
      run: |
        set -ex
        SOURCES=""

        for DIGEST_FILE in "${DIGESTS_DIR}"/*.digest; do
          DIGEST=$(cat "${DIGEST_FILE}" | tr -d '\n\r')
          echo "  ${DIGEST_FILE} → ${DIGEST}"
          SOURCES="${SOURCES} ${REGISTRY}/${IMAGE}@${DIGEST}"
        done

        if [ -z "${SOURCES}" ]; then
          echo "❌ No digest files found in ${DIGESTS_DIR}"
          exit 1
        fi

        FIRST_TAG=""
        for TAG in ${TAGS//,/ }; do
          TARGET="${REGISTRY}/${IMAGE}:${TAG}"
          docker buildx imagetools create -t "${TARGET}" ${SOURCES}
          echo "✅ Multi-arch image: ${TARGET}"
          FIRST_TAG="${FIRST_TAG:-${TAG}}"
        done

        DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${FIRST_TAG}" --format '{{.Manifest.Digest}}')
        echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
branding:
  icon: "layers"
  color: "green"
