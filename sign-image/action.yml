name: Sign docker image
description: 'Deprecated: This action is used to sign docker images using Docker Content Trust (DCT)'
inputs:
  dockerImage:
    description: Docker Image
    required: true
  dockerImageTag:
    description: Docker Images Tags (comma separated supported)
    required: true
  dockerRegistry:
    description: Docker registry (Default docker.io)
    default: "docker.io"
    required: false
  signImage:
    description: Apply signature flag
    default: "true"
    required: false
  DOCKER_USERNAME:
    description: Docker Registry username
    required: true
  DOCKER_PASSWORD:
    description: Docker Registry user password
    required: true
  DOCKER_PRIVATE_KEY_ID:
    description: Docker Hub Signing Private Key ID
    required: false
  DOCKER_PRIVATE_KEY:
    description: Docker Hub Signing Private Key
    required: false
  DOCKER_PRIVATE_KEY_PASSPHRASE:
    description: Docker Hub Signing Private Key Passphrase
    required: false

runs:
  using: "composite"  
  steps:
    - name: Validate DCT configuration
      if: ${{ inputs.signImage == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${{ inputs.DOCKER_PRIVATE_KEY_ID }}" || -z "${{ inputs.DOCKER_PRIVATE_KEY }}" ]]; then
          echo "DCT signing requires DOCKER_PRIVATE_KEY_ID and DOCKER_PRIVATE_KEY"
          exit 1
        fi

    - name: Log in to Docker Registry
      if: ${{ inputs.signImage == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.dockerRegistry }}
        username: ${{ inputs.DOCKER_USERNAME }}
        password: ${{ inputs.DOCKER_PASSWORD }}

    - name: Enable Docker Content Trust
      if: ${{ inputs.signImage == 'true' }}
      shell: bash
      run: |
        echo "DOCKER_CONTENT_TRUST=1" >> $GITHUB_ENV

    - name: Pull and sign Docker image(s)
      if: ${{ inputs.signImage == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        for tag in $(echo "${{ inputs.dockerImageTag }}" | tr ',' '\n'); do
          tag=$(echo "$tag" | xargs)
          image="${{ inputs.dockerRegistry }}/${{ inputs.dockerImage }}:$tag"
          docker pull "$image"
        done

    - name: Sign the published Dockerhub Docker image with DCT
      if: ${{ inputs.signImage == 'true' }}
      uses: sudo-bot/action-docker-sign@latest
      with:
        image-ref: ${{ inputs.dockerRegistry }}/${{ inputs.dockerImage }}:${{ inputs.dockerImageTag}}
        private-key-id: "${{ inputs.DOCKER_PRIVATE_KEY_ID }}"
        private-key: ${{ inputs.DOCKER_PRIVATE_KEY }}
        private-key-passphrase: ${{ inputs.DOCKER_PRIVATE_KEY_PASSPHRASE }}

branding:
  icon: "anchor"
  color: "gray-dark"