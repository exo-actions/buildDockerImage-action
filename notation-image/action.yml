name: Notation sign docker image
description: 'Sign/verify docker images with the Notary Project (Notation). Signs with a KMS-backed plugin (Azure Key Vault, AWS Signer, HashiCorp Vault, ...) or, with signingKey/signingCert, a local key and certificate (no service needed)'
inputs:
  dockerImage:
    description: Docker Image
    required: true
  dockerImageDigest:
    description: Docker Image Digest to sign/verify
    required: true
  dockerRegistry:
    description: Docker registry (Default docker.io)
    default: "docker.io"
    required: false
  DOCKER_USERNAME:
    description: Docker Registry username
    required: true
  DOCKER_PASSWORD:
    description: Docker Registry user password
    required: true
  notationImage:
    description: Enable Docker Image Signing (Notation). Needs either signingKey and signingCert (local mode) or the plugin inputs (pluginName, pluginUrl, pluginChecksum, keyId)
    required: false
    default: "false"
  notationVersion:
    description: "Version of the Notation CLI to install"
    required: false
    default: "1.3.1"
  pluginName:
    description: "Name of the Notation signing plugin (e.g. azure-kv, aws-signer, notation-hashicorp-vault). Required in plugin mode"
    required: false
    default: ""
  pluginUrl:
    description: "Download URL of the signing plugin. Required in plugin mode"
    required: false
    default: ""
  pluginChecksum:
    description: "SHA256 checksum of the signing plugin. Required in plugin mode"
    required: false
    default: ""
  keyId:
    description: "KMS key identifier/ARN/URI for the signing key pair, as expected by the plugin. Required in plugin mode"
    required: false
    default: ""
  signingKey:
    description: "Local signing mode: PEM private key (unencrypted) used to sign, typically from a secret. Selects local mode and replaces the plugin inputs. Requires signingCert"
    required: false
    default: ""
  signingCert:
    description: "Local signing mode: PEM certificate (chain) matching signingKey. Needs a code-signing EKU and digital signature key usage"
    required: false
    default: ""
  signingKeyName:
    description: "Local signing mode: name under which the key is registered in the Notation config"
    required: false
    default: "ci-signing-key"
  signatureFormat:
    description: "Signature envelope format: jws or cose"
    required: false
    default: "cose"
  pluginConfig:
    description: "Plugin-defined config (multi-line, key=value), passed through to the signing plugin"
    required: false
    default: ""
  timestampUrl:
    description: "RFC 3161 Timestamp Authority (TSA) server URL"
    required: false
    default: ""
  timestampRootCert:
    description: "Filepath of the RFC 3161 Timestamp Authority (TSA) root certificate. Required when timestampUrl is set"
    required: false
    default: ""
  verifyImage:
    description: "Run 'notation verify' against the signed digest right after signing. Requires trustPolicy and trustStore to be provided, since Notation verification is always against an explicit trust policy"
    required: false
    default: "false"
  trustPolicy:
    description: "File path to a Notation trustpolicy.json. Required when verifyImage is true"
    required: false
    default: ""
  trustStore:
    description: "Directory path to a Notation trust store (x509/ca, x509/signingAuthority, x509/tsa). Required when verifyImage is true"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Log in to Docker Registry
      if: ${{ inputs.notationImage == 'true' || inputs.verifyImage == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ inputs.dockerRegistry }}
        username: ${{ inputs.DOCKER_USERNAME }}
        password: ${{ inputs.DOCKER_PASSWORD }}
    - name: Install Notation CLI
      if: ${{ inputs.notationImage == 'true' || inputs.verifyImage == 'true' }}
      uses: notaryproject/notation-action/setup@b6fee73110795d6793253c673bd723f12bcf9bbb # v1
      with:
        version: ${{ inputs.notationVersion }}
    - name: Resolve target artifact reference
      if: ${{ inputs.notationImage == 'true' || inputs.verifyImage == 'true' }}
      id: target
      shell: bash
      env:
        DOCKER_REGISTRY: ${{ inputs.dockerRegistry }}
        DOCKER_IMAGE: ${{ inputs.dockerImage }}
        DIGEST: ${{ inputs.dockerImageDigest }}
      run: echo "reference=${DOCKER_REGISTRY}/${DOCKER_IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
    - name: Validate signing inputs
      if: ${{ inputs.notationImage == 'true' }}
      shell: bash
      env:
        SIGNING_KEY: ${{ inputs.signingKey }}
        SIGNING_CERT: ${{ inputs.signingCert }}
        PLUGIN_NAME: ${{ inputs.pluginName }}
        PLUGIN_URL: ${{ inputs.pluginUrl }}
        PLUGIN_CHECKSUM: ${{ inputs.pluginChecksum }}
        KEY_ID: ${{ inputs.keyId }}
      run: |
        if [ -n "$SIGNING_KEY" ]; then
          if [ -z "$SIGNING_CERT" ]; then
            echo "::error::signingCert is required when signingKey is set (local signing mode)"
            exit 1
          fi
        elif [ -z "$PLUGIN_NAME" ] || [ -z "$PLUGIN_URL" ] || [ -z "$PLUGIN_CHECKSUM" ] || [ -z "$KEY_ID" ]; then
          echo "::error::notationImage needs either signingKey+signingCert (local mode) or pluginName, pluginUrl, pluginChecksum and keyId (plugin mode)"
          exit 1
        fi
    - name: Sign the image with Notation (plugin)
      if: ${{ inputs.notationImage == 'true' && inputs.signingKey == '' }}
      uses: notaryproject/notation-action/sign@b6fee73110795d6793253c673bd723f12bcf9bbb # v1
      with:
        plugin_name: ${{ inputs.pluginName }}
        plugin_url: ${{ inputs.pluginUrl }}
        plugin_checksum: ${{ inputs.pluginChecksum }}
        key_id: ${{ inputs.keyId }}
        target_artifact_reference: ${{ steps.target.outputs.reference }}
        signature_format: ${{ inputs.signatureFormat }}
        plugin_config: ${{ inputs.pluginConfig }}
        timestamp_url: ${{ inputs.timestampUrl }}
        timestamp_root_cert: ${{ inputs.timestampRootCert }}
    - name: Sign the image with Notation (local key)
      if: ${{ inputs.notationImage == 'true' && inputs.signingKey != '' }}
      shell: bash
      env:
        SIGNING_KEY: ${{ inputs.signingKey }}
        SIGNING_CERT: ${{ inputs.signingCert }}
        KEY_NAME: ${{ inputs.signingKeyName }}
        SIGNATURE_FORMAT: ${{ inputs.signatureFormat }}
        TIMESTAMP_URL: ${{ inputs.timestampUrl }}
        TIMESTAMP_ROOT_CERT: ${{ inputs.timestampRootCert }}
        REFERENCE: ${{ steps.target.outputs.reference }}
      run: |
        umask 077
        # `notation key add` only registers plugin keys (1.3.x), so register the
        # local key pair in signingkeys.json directly, as `cert generate-test` does.
        confdir="${XDG_CONFIG_HOME:-$HOME/.config}/notation"
        keydir="${confdir}/localkeys"
        mkdir -p "$keydir"
        trap 'rm -f "$keydir/${KEY_NAME}.key" "$keydir/${KEY_NAME}.crt"' EXIT
        printf '%s\n' "$SIGNING_KEY" > "$keydir/${KEY_NAME}.key"
        printf '%s\n' "$SIGNING_CERT" > "$keydir/${KEY_NAME}.crt"
        keysfile="${confdir}/signingkeys.json"
        [ -f "$keysfile" ] || echo '{"keys":[]}' > "$keysfile"
        jq --arg n "$KEY_NAME" --arg k "$keydir/${KEY_NAME}.key" --arg c "$keydir/${KEY_NAME}.crt" \
          '.default = $n | .keys = ((.keys // []) | map(select(.name != $n)) + [{name: $n, keyPath: $k, certPath: $c}])' \
          "$keysfile" > "${keysfile}.tmp"
        mv "${keysfile}.tmp" "$keysfile"
        args=(sign --key "$KEY_NAME" --signature-format "$SIGNATURE_FORMAT")
        if [ -n "$TIMESTAMP_URL" ]; then
          args+=(--timestamp-url "$TIMESTAMP_URL" --timestamp-root-cert "$TIMESTAMP_ROOT_CERT")
        fi
        notation "${args[@]}" "$REFERENCE"
    - name: Verify the Notation signature
      if: ${{ inputs.verifyImage == 'true' }}
      uses: notaryproject/notation-action/verify@b6fee73110795d6793253c673bd723f12bcf9bbb # v1
      with:
        target_artifact_reference: ${{ steps.target.outputs.reference }}
        trust_policy: ${{ inputs.trustPolicy }}
        trust_store: ${{ inputs.trustStore }}
branding:
  icon: "shield"
  color: "blue"
