name: Create publish, sign, cosign and attest docker image
description: this action allow to create publish, sign, cosign and attest docker image. The sign, cosign and attest are optionnals
author: 'eXo Platform'
inputs:
    dockerImage:
      description: Docker Image
      required: true
    dockerImageTag:
      description: Docker Image tag (comma separated for multiple)
      default: "latest"
      required: false
    dockerFileContext:
      description: Dockerfile Context
      default: "."
      required: false
    dockerFile:
      description: "Path to the Dockerfile (relative to the current directory, defaults to '{context}/Dockerfile')"
      required: false
      default: ""
    target:
      description: "Target build stage for a multi-stage Dockerfile"
      required: false
      default: ""
    buildContexts:
      description: "Additional named build contexts (multi-line, name=path)"
      required: false
      default: ""
    dockerRegistry:
      description: Docker registry (Default docker.io)
      default: "docker.io"
      required: false
    generateSBOM:
      description: Generate SBOM flag
      default: "true"
      required: false
    generateProvenance:
      description: Generate provenance flag
      default: "true"
      required: false
    platforms:
      description: "Comma-separated target platforms"
      default: "linux/amd64"
      required: false
    signImage:
      description: (Deprecated) Enable Docker Image Signing (DCT)
      default: "false"
      required: false
    cosignImage:
      description: Enable Docker Image Signing (Cosign)
      default: "false"
      required: false
    cosignOidcImage:
      description: Enable Docker Image Signing (Cosign) with Github OIDC Token (id-token write permission must be provided with cosignImage must be enabled)
      default: "false"
      required: false
    attestImage:
      description: Enable Docker Image Attestation by Github (attestations and id-token write permissions must be provided)
      default: "false"
      required: false
    attestSBOM:
      description: "Also generate an SBOM for the image and attest it with Github (attestations and id-token write permissions must be provided)"
      default: "false"
      required: false
    attestImageRegistry:
      description: Docker Image Registry for Attestation by Github (default docker.io)
      required: false
      default: "docker.io"
    DOCKER_USERNAME:
      description: Docker Registry username
      required: true
    DOCKER_PASSWORD:
      description: Docker Registry user password
      required: true
    DOCKER_PRIVATE_KEY_ID:
      description: Docker Hub Signing Private Key ID
      required: false
    DOCKER_PRIVATE_KEY:
      description: Docker Hub Signing Private Key
      required: false
    DOCKER_PRIVATE_KEY_PASSPHRASE:
      description: Docker Hub Signing Private Key Passphrase
      required: false
    COSIGN_PRIVATE_KEY:
      description: Cosign Signing Private Key
      required: false
    COSIGN_KEY_REF:
      description: "KMS-backed signing key reference (e.g. awskms://, gcpkms://, azurekms://, hashivault://). Takes precedence over COSIGN_PRIVATE_KEY when set"
      required: false
      default: ""
    verifyImage:
      description: "Run 'cosign verify' against each signed tag after signing. Opt-in only: if the same digest was ever previously signed by another method (e.g. mixing cosignImage and cosignOidcImage across runs on a reused tag), Sigstore's transparency log may carry a signature of a different type that makes verification of an otherwise-valid signature fail"
      required: false
      default: "false"
    labels:
      description: "OCI labels for the image (multi-line, key=value)"
      required: false
      default: ""
    annotations:
      description: "OCI annotations for the image (multi-line, key=value)"
      required: false
      default: ""
    COSIGN_PASSWORD:
      description: Cosign Signing Private Key Passphrase
      default: "false"
      required: false 
    buildArgs:
      description: "List of build-time arguments (multi-line, KEY=VALUE)"
      required: false
      default: ""
    push:
      description: "Push the image to registry (set to false for validation-only builds)"
      required: false
      default: "true"
    qemu:
      description: "Set up QEMU for cross-platform emulation (disable if all platforms are native)"
      required: false
      default: "true"
    secrets:
      description: "Build secrets (multi-line, id=value), exposed to RUN --mount=type=secret,id=<id>"
      required: false
      default: ""
    secretFiles:
      description: "Build secrets sourced from files (multi-line, id=path)"
      required: false
      default: ""
    cacheFrom:
      description: "Cache source(s) for docker/build-push-action (multi-line). Defaults to the GitHub Actions cache scoped to dockerImage"
      required: false
      default: ""
    cacheTo:
      description: "Cache destination(s) for docker/build-push-action (multi-line). Defaults to the GitHub Actions cache scoped to dockerImage"
      required: false
      default: ""
    mirrorTargetRegistry:
      description: "If set, mirror the built image to this registry after build (uses mirror-image)"
      required: false
      default: ""
    MIRROR_TARGET_USERNAME:
      description: Target registry username for mirroring (required if mirrorTargetRegistry is set)
      required: false
    MIRROR_TARGET_PASSWORD:
      description: Target registry password for mirroring (required if mirrorTargetRegistry is set)
      required: false
runs:
  using: "composite"  
  steps:
    - name: build docker image
      uses: exo-actions/buildDockerImage-action/build-and-push-image@v1
      id: build-docker-image
      with:
        dockerImage: ${{inputs.dockerImage}}
        dockerImageTag: ${{ inputs.dockerImageTag }}
        dockerRegistry: ${{inputs.dockerRegistry}} 
        dockerFileContext: ${{inputs.dockerFileContext}}
        dockerFile: ${{ inputs.dockerFile }}
        target: ${{ inputs.target }}
        buildContexts: ${{ inputs.buildContexts }}
        generateSBOM: ${{ inputs.generateSBOM }}
        generateProvenance: ${{ inputs.generateProvenance }}
        platforms: ${{ inputs.platforms }}
        labels: ${{ inputs.labels }}
        annotations: ${{ inputs.annotations }}
        buildArgs: ${{ inputs.buildArgs }}
        secrets: ${{ inputs.secrets }}
        secretFiles: ${{ inputs.secretFiles }}
        cacheFrom: ${{ inputs.cacheFrom }}
        cacheTo: ${{ inputs.cacheTo }}
        push: ${{ inputs.push }}
        qemu: ${{ inputs.qemu }}
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
    - name: sign docker image
      uses: exo-actions/buildDockerImage-action/sign-image@v1 
      id: sign-docker-image      
      with:
        dockerImage: ${{inputs.dockerImage}} 
        dockerRegistry: ${{inputs.dockerRegistry}}
        signImage: ${{inputs.signImage}}
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
        DOCKER_PRIVATE_KEY_ID: ${{inputs.DOCKER_PRIVATE_KEY_ID}}
        DOCKER_PRIVATE_KEY: ${{inputs.DOCKER_PRIVATE_KEY}}
        DOCKER_PRIVATE_KEY_PASSPHRASE: ${{inputs.DOCKER_PRIVATE_KEY_PASSPHRASE}}
        dockerImageTag: ${{steps.build-docker-image.outputs.tags}}
    - name: attest docker image
      uses: exo-actions/buildDockerImage-action/attest-image@v1 
      id: attest-docker-image
      with:
        dockerImage: ${{inputs.dockerImage}} 
        dockerImageDigest: ${{ steps.build-docker-image.outputs.digest }}
        dockerRegistry: ${{inputs.dockerRegistry}}
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
        attestImage: ${{inputs.attestImage}}
        attestImageRegistry: ${{inputs.attestImageRegistry}}
        attestSBOM: ${{inputs.attestSBOM}}
    - name: cosign docker image
      uses: exo-actions/buildDockerImage-action/cosign-image@v1 
      id: cosign-docker-image
      with:
        dockerImage: ${{inputs.dockerImage}}
        dockerImageTag: ${{ steps.build-docker-image.outputs.tags }} 
        dockerImageDigest: ${{ steps.build-docker-image.outputs.digest }}
        dockerRegistry: ${{inputs.dockerRegistry}} 
        DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
        cosignImage: ${{inputs.cosignImage}}
        cosignOidcImage: ${{inputs.cosignOidcImage}}
        COSIGN_PRIVATE_KEY: ${{inputs.COSIGN_PRIVATE_KEY}}
        COSIGN_PASSWORD: ${{inputs.COSIGN_PASSWORD}}
        COSIGN_KEY_REF: ${{inputs.COSIGN_KEY_REF}}
        verifyImage: ${{inputs.verifyImage}}
    - name: mirror docker image
      if: ${{ inputs.mirrorTargetRegistry != '' }}
      uses: exo-actions/buildDockerImage-action/mirror-image@v1
      id: mirror-docker-image
      with:
        sourceImage: ${{ inputs.dockerImage }}
        sourceTag: ${{ inputs.dockerImageTag }}
        sourceRegistry: ${{ inputs.dockerRegistry }}
        targetRegistry: ${{ inputs.mirrorTargetRegistry }}
        SOURCE_USERNAME: ${{ inputs.DOCKER_USERNAME }}
        SOURCE_PASSWORD: ${{ inputs.DOCKER_PASSWORD }}
        TARGET_USERNAME: ${{ inputs.MIRROR_TARGET_USERNAME }}
        TARGET_PASSWORD: ${{ inputs.MIRROR_TARGET_PASSWORD }}
branding:
  icon: "anchor"
  color: "gray-dark"