name: Build docker image
description: 'This action is used to build docker images'
inputs:
  dockerImage:
    description: Docker Image
    required: true
  dockerImageTag:
    description: Docker Image tag (comma separated for multiple)
    default: "latest"
    required: false
  dockerFileContext:
    description: Dockerfile Context
    default: "."
    required: false
  dockerFile:
    description: "Path to the Dockerfile (relative to the current directory, defaults to '{context}/Dockerfile')"
    required: false
    default: ""
  target:
    description: "Target build stage for a multi-stage Dockerfile"
    required: false
    default: ""
  buildContexts:
    description: "Additional named build contexts (multi-line, name=path)"
    required: false
    default: ""
  dockerRegistry:
    description: Docker registry (Default docker.io)
    default: "docker.io"
    required: false
  generateSBOM:
    description: Generate SBOM flag
    default: "true"
    required: false
  generateProvenance:
    description: Generate provenance flag
    default: "true"
    required: false
  platforms:
    description: "Comma-separated target platforms"
    default: "linux/amd64"
    required: false
  DOCKER_USERNAME:
    description: Docker Registry username
    required: true
  labels:
    description: "OCI labels for the image (multi-line, key=value)"
    required: false
    default: ""
  annotations:
    description: "OCI annotations for the image (multi-line, key=value)"
    required: false
    default: ""
  buildArgs:
    description: "List of build-time arguments (multi-line, KEY=VALUE)"
    required: false
    default: ""
  push:
    description: "Push the image to registry (set to false for validation-only builds)"
    required: false
    default: "true"
  qemu:
    description: "Set up QEMU for cross-platform emulation (disable if all platforms are native)"
    required: false
    default: "true"
  secrets:
    description: "Build secrets (multi-line, id=value), exposed to RUN --mount=type=secret,id=<id>"
    required: false
    default: ""
  secretFiles:
    description: "Build secrets sourced from files (multi-line, id=path)"
    required: false
    default: ""
  cacheFrom:
    description: "Cache source(s) for docker/build-push-action (multi-line). Defaults to the GitHub Actions cache scoped to dockerImage"
    required: false
    default: ""
  cacheTo:
    description: "Cache destination(s) for docker/build-push-action (multi-line). Defaults to the GitHub Actions cache scoped to dockerImage"
    required: false
    default: ""
  DOCKER_PASSWORD:
    description: Docker Registry user password
    required: true
outputs:
  tags:
    description: 'pushed docker images tags'
    value: ${{ steps.additional-jsontags.outputs.tags}}
  digest:
    description: 'pushed docker images digest'
    value: ${{ steps.get-digest.outputs.digest}}
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Log in to Docker Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.dockerRegistry }}
        username: ${{ inputs.DOCKER_USERNAME }}
        password: ${{ inputs.DOCKER_PASSWORD }}
    - name: Set up QEMU
      if: ${{ inputs.qemu == 'true' }}
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ inputs.platforms }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container
    - name: Build list of additional tags
      id: additional-tags
      uses: actions/github-script@v9
      with:
        script: |
          core.setOutput('tags', `${{ inputs.dockerImageTag }}`.split(",").join("\n"))
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.dockerRegistry }}/${{ inputs.dockerImage }}
        tags: |
          ${{ steps.additional-tags.outputs.tags }}
        labels: ${{ inputs.labels }}
        annotations: ${{ inputs.annotations }}

    - name: Resolve default cache backend
      id: cache
      shell: bash
      env:
        CACHE_FROM: ${{ inputs.cacheFrom }}
        CACHE_TO: ${{ inputs.cacheTo }}
        IMAGE: ${{ inputs.dockerImage }}
      run: |
        DELIM="EOF_$(date +%s%N)"
        {
          echo "from<<${DELIM}"
          if [ -n "${CACHE_FROM}" ]; then echo "${CACHE_FROM}"; else echo "type=gha,scope=${IMAGE}"; fi
          echo "${DELIM}"
        } >> "$GITHUB_OUTPUT"
        {
          echo "to<<${DELIM}"
          if [ -n "${CACHE_TO}" ]; then echo "${CACHE_TO}"; else echo "type=gha,mode=max,scope=${IMAGE}"; fi
          echo "${DELIM}"
        } >> "$GITHUB_OUTPUT"
    - name: Build and push Docker image to Registry
      id: push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.dockerFileContext }}
        file: ${{ inputs.dockerFile }}
        target: ${{ inputs.target }}
        build-contexts: ${{ inputs.buildContexts }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        sbom: ${{ inputs.generateSBOM }}
        provenance: ${{ inputs.generateProvenance }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.buildArgs }}
        secrets: ${{ inputs.secrets }}
        secret-files: ${{ inputs.secretFiles }}
        network: host
        cache-from: ${{ steps.cache.outputs.from }}
        cache-to: ${{ steps.cache.outputs.to }}
    - name: Build Json array of tags for Docker Signing
      shell: bash
      id: additional-jsontags
      run: |
        echo tags=$(echo ${{ inputs.dockerImageTag }} | sed 's/,/\n/g'| jq --raw-input | jq --slurp -c) >> $GITHUB_OUTPUT
    - name: Get Digests for attest and cosign
      shell: bash
      id: get-digest
      run: |
        echo digest=$(echo ${{ steps.push.outputs.digest}}) >> $GITHUB_OUTPUT
branding:
  icon: "anchor"
  color: "gray-dark"