name: Cosign docker image
description: 'This action is used to Cosign docker images'
inputs:
  dockerImage:
    description: Docker Image
    required: true
  dockerImageTag:
    description: Docker Image tag (comma separated for multiple inside table)
    default: "['latest']"
  dockerImageDigest:
    description: Docker Image Digest     
    required: false
  dockerRegistry:
    description: Docker registry (Default docker.io)
    default: "docker.io"
    required: false
  DOCKER_USERNAME:
    description: Docker Registry username
    required: true
  DOCKER_PASSWORD:
    description: Docker Registry user password
    required: true
  cosignImage:
    description: Enable Docker Image Signing (Cosign)
    required: false
    default: "false"
  cosignOidcImage:
    description: Enable Docker Image Signing (Cosign) with Github OIDC Token (id-token write permission must be provided with cosignImage must be enabled)    
    required: false
    default: "false"
  COSIGN_PRIVATE_KEY:
    description: Cosign Signing Private Key
    required: false
  COSIGN_PASSWORD:
    description: Cosign Signing Private Key Passphrase
    required: false
  COSIGN_KEY_REF:
    description: "KMS-backed signing key reference (e.g. awskms://, gcpkms://, azurekms://, hashivault://). Takes precedence over COSIGN_PRIVATE_KEY when set"
    required: false
    default: ""
  verifyImage:
    description: "Run 'cosign verify' against each signed tag after signing. Opt-in only: if the same digest was ever previously signed by another method (e.g. mixing cosignImage and cosignOidcImage across runs on a reused tag), Sigstore's transparency log may carry a signature of a different type that makes verification of an otherwise-valid signature fail"
    required: false
    default: "false"
runs:
  using: "composite"  
  steps:
    - name: Log in to Docker Registry
      if: ${{ inputs.cosignImage == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.dockerRegistry }}
        username: ${{ inputs.DOCKER_USERNAME }}
        password: ${{ inputs.DOCKER_PASSWORD }}
    - name: Install Cosign
      if: ${{ inputs.cosignImage == 'true' }}
      uses: sigstore/cosign-installer@v4.1.2
    - name: Sign the published ghcr.io Docker image with Cosign
      if: ${{ inputs.cosignImage == 'true' }}
      shell: bash
      run: |
        images=""
        TAGS_LIST="$(echo $TAGS | jq -r '.[]' | xargs -r)"
        for tag in ${TAGS_LIST}; do
          images+="${{ inputs.dockerRegistry }}/${{ inputs.dockerImage }}:${tag}@${DIGEST} "
          docker pull ${{ inputs.dockerRegistry }}/${{ inputs.dockerImage }}:${tag}@${DIGEST}
        done
        cosign sign --yes --key "${COSIGN_KEY_REF:-env://COSIGN_PRIVATE_KEY}" ${images}
      env:
        COSIGN_PASSWORD: ${{ inputs.COSIGN_PASSWORD }}
        COSIGN_PRIVATE_KEY: ${{ inputs.COSIGN_PRIVATE_KEY }}
        COSIGN_KEY_REF: ${{ inputs.COSIGN_KEY_REF }}
        DIGEST: ${{ inputs.dockerImageDigest }}
        TAGS: ${{ inputs.dockerImageTag }}
    - name: Verify the Cosign key-based signature
      if: ${{ inputs.cosignImage == 'true' && inputs.verifyImage == 'true' }}
      shell: bash
      run: |
        images=""
        TAGS_LIST="$(echo $TAGS | jq -r '.[]' | xargs -r)"
        for tag in ${TAGS_LIST}; do
          images+="${{ inputs.dockerRegistry }}/${{ inputs.dockerImage }}:${tag}@${DIGEST} "
        done
        if [ -n "${COSIGN_KEY_REF}" ]; then
          cosign verify --key "${COSIGN_KEY_REF}" ${images}
        else
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
          cosign verify --key /tmp/cosign.pub ${images}
        fi
      env:
        COSIGN_PASSWORD: ${{ inputs.COSIGN_PASSWORD }}
        COSIGN_PRIVATE_KEY: ${{ inputs.COSIGN_PRIVATE_KEY }}
        COSIGN_KEY_REF: ${{ inputs.COSIGN_KEY_REF }}
        DIGEST: ${{ inputs.dockerImageDigest }}
        TAGS: ${{ inputs.dockerImageTag }}
    - name: Sign the published ghcr.io Docker image with GitHub OIDC Token
      if: ${{ inputs.cosignOidcImage == 'true' }}
      shell: bash
      run: |
          images=""
          TAGS_LIST="$(echo $TAGS | jq -r '.[]' | xargs -r)"
          for tag in ${TAGS_LIST}; do
            images+="${{ inputs.dockerRegistry }}/${{ inputs.dockerImage }}:${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
      env:
        DIGEST: ${{ inputs.dockerImageDigest }}
        TAGS: ${{ inputs.dockerImageTag }}
    - name: Verify the Cosign keyless (OIDC) signature
      if: ${{ inputs.cosignOidcImage == 'true' && inputs.verifyImage == 'true' }}
      shell: bash
      run: |
        images=""
        TAGS_LIST="$(echo $TAGS | jq -r '.[]' | xargs -r)"
        for tag in ${TAGS_LIST}; do
          images+="${{ inputs.dockerRegistry }}/${{ inputs.dockerImage }}:${tag}@${DIGEST} "
        done
        cosign verify \
          --certificate-identity-regexp "^https://github.com/${GITHUB_REPO}/" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          ${images}
      env:
        DIGEST: ${{ inputs.dockerImageDigest }}
        TAGS: ${{ inputs.dockerImageTag }}
        GITHUB_REPO: ${{ github.repository }}
branding:
  icon: "anchor"
  color: "gray-dark"